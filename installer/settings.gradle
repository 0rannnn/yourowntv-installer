pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // LibADB Android and its X.509 helper are published on JitPack.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = 'FormovieKit'
include ':app'
