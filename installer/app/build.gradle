plugins {
    id 'com.android.application'
}

// The pack's version, one number for the launcher and the setup app (and version.json online): every commit of
// phone-kit and wallpaper-editor plus the launcher's own commits since the original project (origin/main..HEAD).
// It only goes up, so "install -r" always takes the newer build. Without git (or those folders) it stays 1 / 1.0.
def packVersion = {
    try {
        def count = { File dir, String range ->
            def p = ['git', '-C', dir.path, 'rev-list', '--count', range].execute()
            def out = p.text.trim()
            p.waitFor()
            if (p.exitValue() != 0) throw new GradleException('git ' + dir)
            out.toInteger()
        }
        File workspace = rootDir.parentFile.parentFile
        File launcherRepo = new File(workspace, 'cleanyourtv')
        return count(launcherRepo, 'origin/main..HEAD') + count(new File(workspace, 'phone-kit'), 'HEAD') +
                count(new File(workspace, 'wallpaper-editor'), 'HEAD')
    } catch (Exception ignored) {
        return null
    }
}()

android {
    namespace 'com.gathin.kit'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.kit'
        // Wireless debugging with a pairing code is Android 11 (API 30) and later.
        minSdk 30
        targetSdk 34
        versionCode packVersion ?: 1
        versionName packVersion != null ? String.valueOf(packVersion) : '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Installed by hand through the Downloader app, not through a store: the debug key is enough.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    // The themes and the launcher are packed into assets by pack.py; images and the APK are already compressed.
    androidResources {
        noCompress 'apk', 'jpg', 'png', 'webp', 'wav', 'ttf'
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.google.zxing:core:3.5.3'
}
