<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תמונות למסך הבית</title>
<style>
  :root { --bg: #101218; --card: #1a1d26; --text: #f2f3f5; --dim: #9aa0ad; --line: #2a2e3a; --green: #30d158; --red: #ff453a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, system-ui, "Segoe UI", Rubik, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--dim); margin: 0 0 18px; }
  label.pick { display: block; text-align: center; background: #fff; color: #101218; font-weight: 700; font-size: 18px;
    padding: 16px; border-radius: 16px; cursor: pointer; }
  label.pick input { display: none; }
  #bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.14); margin: 22px 0 8px; overflow: hidden; direction: ltr; display: none; }
  #fill { height: 100%; width: 0; background: var(--green); transition: width .35s cubic-bezier(.2,.8,.2,1); }
  #msg { min-height: 24px; }
  #msg.ok { color: var(--green); } #msg.err { color: var(--red); }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  #grid img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>תמונות למסך הבית</h1>
  <p>בוחרים תמונות מהטלפון והן נשמרות בטלוויזיה כערכה משלהן, "תמונות", שאפשר לבחור בכל זמן. כל תמונה נחתכת לגודל המסך (16:9).</p>
  <label class="pick">בחירת תמונות<input id="files" type="file" accept="image/*" multiple></label>
  <div id="bar"><div id="fill"></div></div>
  <div id="msg"></div>
  <div id="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
function msg(text, kind) { $('msg').textContent = text; $('msg').className = kind || ''; }

// The picture made exactly 1920x1080 (cropped from the middle, as a wallpaper fills the screen), as a JPEG.
function toWallpaper(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const W = 1920, H = 1080, k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      const w = img.naturalWidth * k, h = img.naturalHeight * k;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
      g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('לא הצלחתי לעבד את התמונה')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('את התמונה הזאת הדפדפן לא יודע לפתוח')); };
    img.src = url;
  });
}

$('files').onchange = async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  $('bar').style.display = 'block';
  let sent = 0, failed = 0, lastError = '';
  for (const f of files) {
    msg('שולח ' + (sent + failed + 1) + ' מתוך ' + files.length + '…');
    try {
      // The browser makes it 1920x1080; a picture it cannot open (HEIC from an iPhone or a Samsung) goes as it is,
      // and the TV makes it.
      let blob;
      try { blob = await toWallpaper(f); } catch (e) { blob = f; }
      let r;
      try { r = await fetch('/api/photo', { method: 'POST', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob }); }
      catch (e) { throw new Error('אין חיבור לטלוויזיה: לבדוק שהטלפון על אותו Wi-Fi'); }
      let j = {};
      try { j = await r.json(); } catch (e) {}
      if (!r.ok || j.error) throw new Error(j.error || 'הטלוויזיה לא קיבלה את התמונה (' + r.status + ')');
      sent++;
      const im = document.createElement('img'); im.src = URL.createObjectURL(blob); $('grid').prepend(im);
    } catch (err) { failed++; lastError = (f.name ? f.name + ': ' : '') + err.message; }
    $('fill').style.width = Math.round((sent + failed) / files.length * 100) + '%';
  }
  e.target.value = '';
  if (failed) msg(sent + ' תמונות נשלחו, ' + failed + ' לא הצליחו. ' + lastError, 'err');
  else msg('✓ ' + sent + ' תמונות נשלחו לטלוויזיה', 'ok');
};
</script>
</body>
</html>
